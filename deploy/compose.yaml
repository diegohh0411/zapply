# Local development dependencies. Run the binary on the host (see Makefile).
name: zapply
services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: zapply
      POSTGRES_PASSWORD: zapply
      POSTGRES_DB: zapply
    ports:
      - "127.0.0.1:${ZAPPLY_PG_PORT:-54329}:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "zapply"]
      interval: 2s
      retries: 30
  nats:
    image: docker.io/library/nats:2-alpine
    command: ["--http_port", "8222"]
    ports:
      - "127.0.0.1:${ZAPPLY_NATS_PORT:-4222}:4222"
      - "127.0.0.1:${ZAPPLY_NATS_HTTP_PORT:-8222}:8222"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz"]
      interval: 2s
      retries: 30
  # Firecrawl Local reads posting links for the new job dialog (FIRECRAWL_URL).
  # Opt-in, since its first build compiles Rust: `make firecrawl`.
  firecrawl:
    profiles: [firecrawl]
    build: ./firecrawl
    image: localhost/zapply-firecrawl:0.1.0
    environment:
      # off: pages are fetched only from this machine. auto also hands pages
      # that block it to Firecrawl Cloud, which then sees their URLs.
      FIRECRAWL_CLOUD: ${FIRECRAWL_CLOUD:-off}
      # Required: firecrawl-local refuses a non-loopback bind without it.
      FIRECRAWL_LOCAL_TOKEN: ${FIRECRAWL_TOKEN:-}
    # Chromium renders JavaScript pages with its sandbox on, which Podman's
    # default seccomp profile allows. Docker's blocks it: pages then load
    # without JavaScript, with a warning (docs/parts/04-jobs.md).
    ports:
      - "127.0.0.1:${ZAPPLY_FIRECRAWL_PORT:-3002}:3002"
  # Crawl4AI renders posting links in a stealth Chromium, as a scraper provider
  # (Administration, Scraping). Opt-in: `make crawl4ai`, then add a Crawl4AI
  # provider at http://127.0.0.1:11235.
  crawl4ai:
    profiles: [crawl4ai]
    image: docker.io/unclecode/crawl4ai:0.9.5
    # Chromium needs more shared memory than the container default.
    shm_size: 1g
    environment:
      # Optional bearer token (a Crawl4AI system key holds the same value).
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_TOKEN:-}
      CRAWL4AI_NO_CLOUD_NOTICE: "1"
    ports:
      - "127.0.0.1:${ZAPPLY_CRAWL4AI_PORT:-11235}:11235"
volumes:
  pgdata:
