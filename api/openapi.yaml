    DecisionModel:
      type: object
      required: [id, name, context_length, pricing, compatibility_reason]
      properties:
        id: { type: string }
        name: { type: string }
        context_length: { type: integer }
        pricing: { type: object, additionalProperties: true }
        compatibility_reason: { type: string }
        reasoning: { $ref: '#/components/schemas/ReasoningOptions' }
    ExtractionModel:
      type: object
      required: [id, name, context_length, pricing, compatibility_reason, typed]
      properties:
        id: { type: string }
        name: { type: string }
        context_length: { type: integer }
        pricing: { type: object, additionalProperties: true }
        compatibility_reason: { type: string, description: "Empty when the model can be selected." }
        typed: { type: boolean, description: "Answers salaries as numbers; other models answer text that is parsed." }
    ReasoningOptions:
      type: object
      description: Thinking control a model accepts. Absent when the model does not reason.
      required: [mandatory, efforts]
      properties:
        mandatory: { type: boolean, description: "When true, reasoning cannot be turned off." }
        efforts:
          type: array
          description: Accepted efforts, highest first. Empty when the model exposes no effort choice.
          items: { type: string, enum: [max, xhigh, high, medium, low, minimal, off] }
    SummaryRows:
      type: integer
      minimum: 1
      maximum: 4
      description: Lines a generated summary fills on the CV page. Fitting reserves this many lines, and the model is asked to revise a summary that wraps to more or fewer. Omitted updates preserve the saved value.
    ModelSettings:
      type: object
      required: [version, decision_model, summary_rows, updated_at]
      properties:
        decision_model: { type: string, nullable: true }
        summary_model: { type: string, nullable: true }
        summary_endpoint: { type: string, nullable: true }
        summary_rows: { $ref: '#/components/schemas/SummaryRows' }
        summary_reasoning_effort: { type: string, nullable: true, enum: [off, minimal, low, medium, high, xhigh, max], description: "Thinking effort for summaries; null is automatic." }
        extraction_model: { type: string, nullable: true, description: "Extraction model that reads posting fields; null when off." }
        version: { type: integer }
        updated_at: { type: string, format: date-time }
    ScraperProvider:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [firecrawl, crawl4ai, edge], description: "The scraping API: Firecrawl (hosted or self-hosted), a self-hosted Crawl4AI server, or edge workers on residential machines that pull jobs from this server." }
        base_url: { type: string, nullable: true, description: "The API's http(s) address; null is Firecrawl's hosted API. Required for Crawl4AI, which has no hosted API. Must be null for edge." }
        key_id: { type: string, format: uuid, nullable: true, description: "A system key of the provider's own kind, sent as a bearer token; null sends none." }
        credit_usd: { type: string, nullable: true, pattern: '^\d{1,6}(\.\d{1,12})?$', description: "What one provider credit costs. Members are charged for the credits their scrapes use (Firecrawl: 1 per page, 5 through its stealth proxy; other providers: 1). Null makes the provider free. Not allowed for edge workers." }
    ScraperRule:
      type: object
      required: [host, providers]
      properties:
        host: { type: string, description: "A bare lowercase hostname. The rule also covers its subdomains." }
        providers:
          type: array
          minItems: 1
          description: "Positions in the provider list, in the order to try them."
          items: { type: integer, minimum: 0 }
    ScraperSettingsInput:
      type: object
      required: [providers, rules]
      properties:
        providers:
          type: array
          maxItems: 10
          description: "Tried in order until one reads the page."
          items: { $ref: '#/components/schemas/ScraperProvider' }
        rules:
          type: array
          maxItems: 100
          description: "The first rule whose host matches the posting's host replaces the default order."
          items: { $ref: '#/components/schemas/ScraperRule' }
    SearchSettings:
      type: object
      required: [provider, key_id, credit_usd, max_results, version, updated_at]
      properties:
        provider: { type: string, enum: [theirstack] }
        key_id: { type: string, format: uuid, nullable: true, description: A TheirStack system key. }
        credit_usd: { type: string, nullable: true, description: What one TheirStack API credit costs. }
        max_results: { type: integer, description: The most postings one poll asks for. }
        version: { type: integer }
        updated_at: { type: string, format: date-time }
    SearchSettingsInput:
      type: object
      required: [key_id, credit_usd, max_results]
      properties:
        key_id: { type: string, format: uuid, nullable: true }
        credit_usd: { type: string, nullable: true, pattern: '^\d{1,6}(\.\d{1,12})?$' }
        max_results: { type: integer, minimum: 1, maximum: 100 }
    ScraperSettings:
      type: object
      required: [providers, rules, saved, version, updated_at]
      properties:
        providers:
          type: array
          items: { $ref: '#/components/schemas/ScraperProvider' }
        rules:
          type: array
          items: { $ref: '#/components/schemas/ScraperRule' }
        saved: { type: boolean, description: "False until an owner saves, or the environment is imported at first boot." }
        version: { type: integer }
        updated_at: { type: string, format: date-time }
    EdgeWorkerInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        allowed_hosts: { type: array, maxItems: 50, items: { type: string }, description: "Bare lowercase hostnames the worker may open, each covering its subdomains. Empty (the default) allows none." }
        max_per_hour: { type: integer, minimum: 1, maximum: 600, description: "Jobs the worker may take per rolling hour. Default 20." }
        max_concurrent: { type: integer, minimum: 1, maximum: 10, description: "Jobs the worker may hold at once. Default 1." }
    EdgeWorkerPatch:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        enabled: { type: boolean }
        allowed_hosts: { type: array, maxItems: 50, items: { type: string } }
        max_per_hour: { type: integer, minimum: 1, maximum: 600 }
        max_concurrent: { type: integer, minimum: 1, maximum: 10 }
    EdgeWorker:
      type: object
      required: [id, name, enabled, allowed_hosts, max_per_hour, max_concurrent, created_at, version, jobs_24h, done_24h, failed_24h]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        enabled: { type: boolean }
        allowed_hosts: { type: array, items: { type: string } }
        max_per_hour: { type: integer }
        max_concurrent: { type: integer }
        last_seen_at: { type: string, format: date-time, nullable: true, description: "When the worker last polled for work." }
        created_at: { type: string, format: date-time }
        version: { type: integer }
        jobs_24h: { type: integer, description: "Jobs the worker took in the last 24 hours." }
        done_24h: { type: integer }
        failed_24h: { type: integer, description: "Failed or timed-out jobs among them." }
    EdgeWorkerCreated:
      type: object
      required: [worker, token]
      properties:
        worker: { $ref: '#/components/schemas/EdgeWorker' }
        token: { type: string, description: "The worker's bearer token (ZAPPLY_EDGE_TOKEN). Shown once; only its hash is stored." }
    EdgeJob:
      type: object
      required: [id, url]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
    EdgeJobResult:
      type: object
      properties:
        markdown: { type: string, description: "At most 1 MiB." }
        raw_html: { type: string, description: "At most 4 MiB." }
        metadata: { type: object, additionalProperties: true, description: "At most 64 KiB serialized (og: and page metadata)." }
        status_code: { type: integer, description: "The site's HTTP status, when it answered." }
        error: { type: string, maxLength: 500 }
    MatchRunSummary:
      type: object
      required: [run_id, status, stale]
      properties:
        run_id: { type: string, format: uuid }
        status: { type: string }
        score: { type: number, nullable: true }
        stale: { type: boolean }
    MatchEstimate:
      type: object
      required: [available, reason, questions, requests]
      properties:
        available: { type: boolean }
        reason: { type: string }
        cost_usd: { type: string, nullable: true }
        questions: { type: integer }
        requests: { type: integer }
        available_7d_usd: { type: string }
        available_30d_usd: { type: string }
    Requirement:
      type: object
      required: [text, text_hash, class, original_class, type, line, min_years]
      properties:
        text: { type: string }
        text_hash: { type: string }
        class: { type: string }
        original_class: { type: string }
        type: { type: string }
        line: { type: integer }
        source_start: { type: integer }
        source_end: { type: integer }
        min_years: { type: number }
        degree: { type: string }
        language: { type: string }
    Coverage:
      allOf:
        - $ref: '#/components/schemas/Requirement'
        - type: object
          required: [status, strength, provisional, highlight_ids, review]
          properties:
            status: { type: string }
            strength: { type: number }
            provisional: { type: boolean }
            evidence_title: { type: string }
            evidence_id: { type: string }
            highlight_ids: { type: array, items: { type: string } }
            answer:
              type: object
              properties:
                score: { type: number }
                confidence: { type: number }
                probabilities: { type: object, additionalProperties: { type: number } }
                legend: { type: object, additionalProperties: true }
            check: { type: string }
            review: { type: boolean }
            citations:
              type: array
              items:
                type: object
                required: [id, text]
                properties:
                  id: { type: string }
                  text: { type: string }
    Selection:
      type: object
      required: [evidence_id, relevance, highlight_ids]
      properties:
        title: { type: string }
        evidence_id: { type: string }
        relevance: { type: number }
        highlight_ids: { type: array, items: { type: string } }
        highlight_scores:
          type: object
          description: Expected whole-posting relevance of each answered highlight, including library opt-outs. Absent on historical results.
          additionalProperties: { type: number, minimum: 0, maximum: 1 }
    EvidenceMatch:
      allOf:
        - $ref: '#/components/schemas/Selection'
    Insight:
      type: object
      required: [type, text]
      properties:
        type: { type: string }
        text: { type: string }
        text_hash: { type: string }
        evidence_id: { type: string }
    MatchResult:
      type: object
      required: [score, must_met, must_total, partial, seniority, relevant_years, scoring_version, requirements, evidence, selection, suggestions, skills, insights]
      properties:
        score: { type: number, nullable: true, description: "Historical coverage score; null for whole-posting matching." }
        must_met: { type: integer, description: "Historical requirement count; zero for whole-posting matching." }
        must_total: { type: integer, description: "Historical requirement count; zero for whole-posting matching." }
        partial: { type: boolean }
        seniority: { type: string }
        relevant_years: { type: number }
        scoring_version: { type: integer }
        requirements: { type: array, description: 'Historical requirement analysis; empty for whole-posting matching.', items: { $ref: '#/components/schemas/Coverage' } }
        evidence: { type: array, items: { $ref: '#/components/schemas/EvidenceMatch' } }
        selection: { type: array, items: { $ref: '#/components/schemas/Selection' } }
        suggestions: { type: array, items: { $ref: '#/components/schemas/Selection' } }
        insights: { type: array, items: { $ref: '#/components/schemas/Insight' } }
        skills:
          type: array
          items:
            type: object
            required: [skill_id, relevance]
            properties:
              skill_id: { type: string }
              name: { type: string }
              relevance: { type: number }
    MatchRun:
      type: object
      required: [id, job_id, status, stage, model, trigger, blocked_reason, version, total, answered, cached, unanswered, created_at, stale, changed, added, removed, cost_usd]
      properties:
        id: { type: string, format: uuid }
        job_id: { type: string, format: uuid }
        status: { type: string }
        stage: { type: string }
        model: { type: string, nullable: true }
        pipeline: { type: integer }
        trigger: { type: string }
        blocked_reason: { type: string }
        next_eligible_at: { type: string, format: date-time, nullable: true }
        version: { type: integer }
        total: { type: integer }
        answered: { type: integer }
        cached: { type: integer }
        unanswered: { type: integer }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        score: { type: number, nullable: true }
        must_met: { type: integer }
        must_total: { type: integer }
        stale: { type: boolean }
        truncated: { type: boolean }
        obsolete_overrides: { type: array, items: { type: string } }
        changed: { type: integer }
        added: { type: integer }
        removed: { type: integer }
        cost_usd: { type: string }
        selection: { type: array, items: { $ref: '#/components/schemas/Selection' } }
        suggestions: { type: array, items: { $ref: '#/components/schemas/Selection' } }
        skills:
          type: array
          items:
            type: object
            required: [skill_id, relevance]
            properties:
              skill_id: { type: string }
              name: { type: string }
              relevance: { type: number }
        result: { $ref: '#/components/schemas/MatchResult' }
    MatchRunPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/MatchRun' } }
        next_cursor: { type: string, format: uuid }

    NotificationKind:
      type: string
      enum: [mail, job_alert]
    Notification:
      type: object
      required: [id, kind, occurred_at, read_at, archived_at, mail, job_alert]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/NotificationKind' }
        occurred_at: { type: string, format: date-time }
        read_at: { type: string, format: date-time, nullable: true }
        archived_at: { type: string, format: date-time, nullable: true }
        mail:
          nullable: true
          description: Set when `kind` is `mail`.
          allOf: [{ $ref: '#/components/schemas/MailMessage' }]
        job_alert:
          nullable: true
          description: Set when `kind` is `job_alert`.
          allOf: [{ $ref: '#/components/schemas/JobAlert' }]
    JobAlert:
      type: object
      description: A new posting on a watched board that matched its filters.
      required: [id, watch_id, company, title, location, url, remote, published_at, found_at]
      properties:
        id: { type: string, format: uuid }
        watch_id: { type: string, format: uuid }
        company: { type: string }
        title: { type: string }
        location: { type: string }
        url: { type: string, description: The posting on the employer's board. }
        remote: { type: boolean }
        published_at: { type: string, format: date-time, nullable: true, description: When the ATS says it was published. }
        found_at: { type: string, format: date-time }
    JobAts:
      type: string
      enum: [greenhouse, lever, ashby]
    JobWatchKind:
      type: string
      enum: [board, search]
      description: "board watches one employer's ATS board; search runs a saved query across every company through the job search provider, billed to the member's plan."
    JobWatch:
      type: object
      required: [id, kind, ats, board, board_url, company, keywords, locations, country, remote_only, every_hours, paused, last_checked_at, last_error, blocked_reason, next_check_at, spent_30d_usd, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/JobWatchKind' }
        ats: { allOf: [{ $ref: '#/components/schemas/JobAts' }], nullable: true, description: Null for a search. }
        board: { type: string, nullable: true, description: "The employer's board slug; null for a search." }
        board_url: { type: string, nullable: true }
        company: { type: string, description: "The company a board belongs to, or a search's name." }
        country: { type: string, nullable: true, description: "A search's ISO country code, such as MX." }
        every_hours: { type: integer, nullable: true, enum: [1, 2, 6, 24], description: "How often a search runs; null for a board, read every 30 minutes." }
        blocked_reason: { type: string, description: "Why a search was not run when due, or empty: plan (beyond the plan's search watchers), provider_unavailable, usage_limit, membership_required, membership_suspended or request_exceeds_plan." }
        next_check_at: { type: string, format: date-time, nullable: true, description: "When a search runs next; null for a board or a paused search." }
        spent_30d_usd: { type: string, description: "What a search's polls cost in the last 30 days; 0 for a board." }
        keywords: { type: array, items: { type: string }, description: A posting matches when its title contains any (empty matches all). }
        locations: { type: array, items: { type: string }, description: A posting matches when its location contains any (empty matches all). }
        remote_only: { type: boolean }
        paused: { type: boolean }
        last_checked_at: { type: string, format: date-time, nullable: true, description: The board's last successful read. }
        last_error: { type: string, description: Why the last read failed, or empty. }
        created_at: { type: string, format: date-time }
    JobWatchList:
      type: object
      required: [items, search]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/JobWatch' } }
        search: { $ref: '#/components/schemas/SearchAllowance' }
    SearchAllowance:
      type: object
      required: [allowed, used, available, credit_usd, max_results]
      description: What the member's plan allows for search watchers, and what a poll can cost.
      properties:
        allowed: { type: integer, description: "Search watchers the member's plan allows; 0 without an active plan." }
        used: { type: integer }
        available: { type: boolean, description: False until the owner configures the job search provider. }
        credit_usd: { type: string, nullable: true, description: What one provider credit costs; a poll costs one credit per posting it returns. }
        max_results: { type: integer, description: The most postings one poll returns, which bounds its cost. }
    JobWatchInput:
      type: object
      properties:
        kind: { $ref: '#/components/schemas/JobWatchKind' }
        url: { type: string, maxLength: 2048, description: "For a board (required): a careers link, job-boards.greenhouse.io/<board>, jobs.lever.co/<board> or jobs.ashbyhq.com/<board>, or a posting on one." }
        company: { type: string, maxLength: 200, description: "A board's company, defaulting to the name the board publishes; a search's name, defaulting to its terms and places." }
        country: { type: string, pattern: '^[A-Za-z]{2}$', description: "For a search: an ISO country code." }
        every_hours: { type: integer, enum: [1, 2, 6, 24], description: "For a search: how often it runs (default 2)." }
        keywords: { type: array, maxItems: 20, items: { type: string, maxLength: 100 } }
        locations: { type: array, maxItems: 20, items: { type: string, maxLength: 100 } }
        remote_only: { type: boolean }
    JobWatchPatch:
      type: object
      properties:
        company: { type: string, maxLength: 200 }
        country: { type: string, pattern: '^([A-Za-z]{2})?$', description: "A search's country; an empty string removes it." }
        every_hours: { type: integer, enum: [1, 2, 6, 24] }
        keywords: { type: array, maxItems: 20, items: { type: string, maxLength: 100 } }
        locations: { type: array, maxItems: 20, items: { type: string, maxLength: 100 } }
        remote_only: { type: boolean }
        paused: { type: boolean }
    NotificationPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
        next_cursor: { type: string, format: uuid }
    NotificationSummary:
      type: object
      required: [unread]
      properties:
        unread: { type: integer }
    NotificationRead:
      type: object
      properties:
        ids:
          type: array
          maxItems: 500
          items: { type: string, format: uuid }
        all: { type: boolean }
        unread: { type: boolean, description: Mark the named ones unread instead. }
    NotificationArchive:
      type: object
      properties:
        ids:
          type: array
          maxItems: 500
          items: { type: string, format: uuid }
        read: { type: boolean, description: Archive every read notification in the inbox. }
        restore: { type: boolean, description: Move the named ones back to the inbox. }
    MailCategory:
      type: string
      enum: [received, assessment, interview, rejection, offer]
    MailAccount:
      type: object
      required: [id, provider, address, status, last_error, retry_at, mails_done, mails_total, mails_relevant, version, created_at]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string, enum: [google] }
        address: { type: string }
        status: { type: string, enum: [active, paused, needs_reconnect, disconnected] }
        last_synced_at: { type: string, format: date-time, nullable: true }
        last_error: { type: string }
        retry_at:
          type: string
          format: date-time
          nullable: true
          description: When a sync held back by Gmail's rate limit resumes by itself.
        mails_done: { type: integer, description: Messages classified so far. }
        mails_total:
          type: integer
          description: Messages found so far, classified or not. Grows while a backlog is being read.
        mails_relevant: { type: integer, description: Classified messages that concern an application. }
        version: { type: integer }
        created_at: { type: string, format: date-time }
    MailAccountList:
      type: object
      required: [configured, items]
      properties:
        configured: { type: boolean }
        items: { type: array, items: { $ref: '#/components/schemas/MailAccount' } }
    MailAccountUpdate:
      type: object
      required: [paused]
      properties:
        paused: { type: boolean }
    MailConnect:
      type: object
      required: [url]
      properties:
        url: { type: string }
    MailConnectComplete:
      type: object
      required: [state, code]
      properties:
        state: { type: string, minLength: 1, maxLength: 512 }
        code: { type: string, minLength: 1, maxLength: 2048 }
    MailMessage:
      type: object
      required: [id, account_id, category, from, subject, snippet, received_at, classified_at, gmail_url]
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        category: { $ref: '#/components/schemas/MailCategory' }
        job_id: { type: string, format: uuid, nullable: true }
        from: { type: string }
        subject: { type: string }
        snippet: { type: string }
        received_at: { type: string, format: date-time }
        classified_at: { type: string, format: date-time }
        gmail_url: { type: string, format: uri }
        status_change:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/MailStatusChange' }]
    MailStatusChange:
      type: object
      description: >
        The job status a message proposed, once it was linked to a job.
        `no_change` leaves the job as it is; `review` waits for the member;
        `applied` moved the job (`auto` when no one had to confirm it);
        `dismissed` and `undone` are the member declining or reverting it.
      required: [outcome, proposed_status_id, previous_status_id, confidence, auto]
      properties:
        outcome: { type: string, enum: [no_change, review, applied, dismissed, undone] }
        proposed_status_id: { type: string, format: uuid, nullable: true }
        previous_status_id: { type: string, format: uuid, nullable: true }
        confidence: { type: number, nullable: true }
        auto: { type: boolean }
    MailStatusChangeAction:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [apply, dismiss, undo] }
    MailMessagePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/MailMessage' } }
        next_cursor: { type: string, format: uuid }
