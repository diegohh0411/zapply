      enum:
        - profile.updated
        - organization.created
        - organization.updated
        - organization.deleted
        - evidence.created
        - evidence.updated
        - evidence.moved
        - evidence.archived
        - evidence.unarchived
        - evidence.deleted
        - skill.created
        - skill.updated
        - skill.merged
        - skill.deleted
        - job_status.created
        - job_status.updated
        - job_status.moved
        - job_status.deleted
        - job.created
        - job.updated
        - job.moved
        - job.archived
        - job.unarchived
        - job.deleted
        - job_activity.created
        - job_activity.updated
        - job_activity.deleted
        - job_view.created
        - job_view.updated
        - job_view.deleted
        - membership.changed
        - usage.changed
        - model_operation.changed
        - match_run.changed
        - mail.account.updated
