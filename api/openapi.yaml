  /v1/admin/text-model-endpoints:
    get:
      operationId: listTextModelEndpoints
      parameters:
        - name: model
          in: query
          required: true
          schema: { type: string, pattern: '^[a-zA-Z0-9_.:-]+/[a-zA-Z0-9_.:-]+$' }
      responses:
        '200':
          description: Compatible provider endpoints for a text model (owner only).
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [tag, name, service_tier]
                  properties:
                    service_tier: { type: string, description: "Endpoint capacity tier; default for standard endpoints." }
                    tag: { type: string }
                    name: { type: string }
        default: { $ref: '#/components/responses/Problem' }
  /v1/admin/text-models:
    get:
      operationId: listTextModels
      responses:
        '200':
          description: Available OpenRouter text models (owner only).
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DecisionModel' } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/admin/decision-models:
    get:
      operationId: listDecisionModels
      responses:
        '200':
          description: Decision model catalogue (owner only).
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DecisionModel' } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/admin/extraction-models:
    get:
      operationId: listExtractionModels
      responses:
        '200':
          description: Models served on OpenRouter's Extractions route (owner only).
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ExtractionModel' } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/admin/model-settings:
    get:
      operationId: getModelSettings
      responses:
        '200':
          description: Owner model settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelSettings' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      operationId: putModelSettings
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision_model]
              properties:
                decision_model: { type: string, nullable: true }
                summary_model: { type: string, nullable: true }
                summary_endpoint: { type: string, nullable: true }
                summary_rows: { $ref: '#/components/schemas/SummaryRows' }
                summary_reasoning_effort: { type: string, nullable: true, enum: [off, minimal, low, medium, high, xhigh, max], description: "Thinking effort for summaries; null is automatic. Must be one the summary model accepts." }
                extraction_model: { type: string, description: "Reads posting fields the page does not publish. Omitted keeps the saved model; an empty string turns extraction off." }
      responses:
        '200':
          description: Updated settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelSettings' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/admin/scraper-settings:
    get:
      operationId: getScraperSettings
      responses:
        '200':
          description: The scraper providers and per-site rules (owner only).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScraperSettings' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      operationId: putScraperSettings
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScraperSettingsInput' }
      responses:
        '200':
          description: Updated settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScraperSettings' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/admin/search-settings:
    get:
      operationId: getSearchSettings
      tags: [platform]
      responses:
        '200':
          description: The job search provider behind search watchers (owner only).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchSettings' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      operationId: putSearchSettings
      tags: [platform]
      description: >
        Sets the TheirStack key and what one of its API credits costs. Search
        watchers are available once both are set; each poll is billed to the
        member at the credits TheirStack charged (one per posting returned).
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchSettingsInput' }
      responses:
        '200':
          description: Updated settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchSettings' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/admin/edge-workers:
    get:
      operationId: listEdgeWorkers
      tags: [platform]
      description: Edge workers with their last-24-hours job counts (owner only).
      responses:
        '200':
          description: All edge workers, newest first.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/EdgeWorker' } }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createEdgeWorker
      tags: [platform]
      description: Registers an edge worker. The response carries its token, which is never shown again.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EdgeWorkerInput' }
      responses:
        '201':
          description: The worker and its token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EdgeWorkerCreated' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/admin/edge-workers/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    patch:
      operationId: updateEdgeWorker
      tags: [platform]
      description: Changes the fields sent; the others keep their value.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EdgeWorkerPatch' }
      responses:
        '200':
          description: The updated worker.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EdgeWorker' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/admin/edge-workers/{id}/token:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      operationId: rotateEdgeWorkerToken
      tags: [platform]
      description: Replaces the worker's token; the old one stops working at once. The new token is shown only in this response.
      responses:
        '200':
          description: The worker and its new token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EdgeWorkerCreated' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/edge/jobs/claim:
    post:
      operationId: claimEdgeJob
      tags: [edge]
      security: [{ edgeToken: [] }]
      description: |
        Edge workers only (the `edge` tag is served by a hand-written handler,
        outside user authentication). Long-polls up to 25 seconds for a scrape
        job the worker may take: the oldest queued job whose host is on its
        allowed list, within its hourly and concurrent limits. 204 when there
        is none; poll again.
      responses:
        '200':
          description: A job. Read the page at `url` and post the result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EdgeJob' }
        '204': { description: No job within the wait. }
        '401': { description: The token is unknown, rotated or disabled. }
  /v1/edge/jobs/{id}/result:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      operationId: postEdgeJobResult
      tags: [edge]
      security: [{ edgeToken: [] }]
      description: |
        Edge workers only. Posts what the worker read for a job it claimed.
        The body is limited to 6 MiB. A result with an `error` or a
        `status_code` of 400 or more marks the job failed: with a status code
        the page is unreadable (blocked, gone), without one the worker itself
        failed. 404 when the job is not claimed by this worker or has expired.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EdgeJobResult' }
      responses:
        '204': { description: Recorded. }
        '400': { description: Malformed or oversized result. }
        '401': { description: The token is unknown, rotated or disabled. }
        '404': { description: The job is not claimed by this worker, or ran out of time. }
        '413': { description: The body or a field is too large. }
  /v1/jobs/{id}/match-estimate:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getMatchEstimate
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchEstimate' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/jobs/{id}/match-runs:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listMatchRuns
      parameters:
        - name: before
          in: query
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchRunPage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createMatchRun
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 255 }
        - name: pipeline
          in: query
          description: Matching pipeline. Defaults to 3 (whole-posting relevance). Versions 1 and 2 retain historical requirement analysis.
          schema: { type: integer, minimum: 1, maximum: 3 }
      responses:
        '202':
          description: Success.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchRun' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/match-runs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getMatchRun
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchRun' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/match-runs/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: cancelMatchRun
      responses:
        '204':
          description: Success.
        default: { $ref: '#/components/responses/Problem' }
  /v1/jobs/{id}/match-overrides/{text_hash}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: text_hash
        in: path
        required: true
        schema: { type: string, pattern: "^[a-f0-9]{64}$" }
    put:
      operationId: putMatchOverride
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [class]
              properties:
                class: { type: string, enum: [must, preferred, duty, trait, ignore] }
      responses:
        '204':
          description: Success.
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteMatchOverride
      responses:
        '204':
          description: Success.
        default: { $ref: '#/components/responses/Problem' }

  /v1/cv-templates:
    get:
      operationId: listCvTemplates
      tags: [cv]
      description: Every CV template version, with the files a browser compiles it with.
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CvTemplate" } }
        default: { $ref: "#/components/responses/Problem" }
  /v1/jobs/{id}/cv:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getCv
      tags: [cv]
      description: |
        The job's CV draft and its content before fitting, built from the
        library, the latest completed match run and the draft's picks. The
        draft is created on first read. The ETag is the draft's version.
      responses:
        "200":
          description: Success.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CvPreview" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: putCv
      tags: [cv]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CvDraftInput" }
      responses:
        "200":
          description: The saved draft, rebuilt.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CvPreview" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/jobs/{id}/cv/fit:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      operationId: putCvFit
      tags: [cv]
      description: |
        Reports the page fit the browser found for the preview whose fit_key
        this is. The summary is written only from the content that fit keeps,
        so until a fit for the current content is reported the summary waits.
        A fit for content that has since changed is a conflict.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CvFitInput" }
      responses:
        "200":
          description: The preview, rebuilt with the reported fit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CvPreview" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/jobs/{id}/cv/exports:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: listCvExports
      tags: [cv]
      description: The job's exports, newest first, without their content.
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CvExportPage" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createCvExport
      tags: [cv]
      description: |
        Stores an immutable snapshot of the CV the client fitted: the draft's
        content, rebuilt on the server, without the dropped items. A stale
        draft version fails with 412; a different content hash (the library
        changed since the preview) with 409.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CvExportInput" }
      responses:
        "201":
          description: The snapshot, with its content.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CvExport" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/cv-exports/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getCvExport
      tags: [cv]
      responses:
        "200":
          description: The snapshot, with its content.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CvExport" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/cv-exports/{id}/pdf:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getCvExportPdf
      tags: [cv]
      description: |
        Compiles the snapshot on the server, for clients without a browser.
        Nothing is stored. 503 when the server lacks the template's Typst
        version.
      responses:
        "200":
          description: The PDF.
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }

  /v1/mail/accounts:
    get:
      operationId: listMailAccounts
      tags: [mail]
      description: |
        Connected mailboxes (docs/parts/10-mail-plan.md). `configured` is false
        when the server has no Google OAuth client, in which case connecting
        answers 503.
      responses:
        "200":
          description: The member's mail accounts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailAccountList" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/mail/accounts/google/start:
    post:
      operationId: startGoogleConnect
      tags: [mail]
      description: |
        Begins the Gmail consent flow. Send the browser to `url`; Google returns
        to the server's `/oauth/google/callback`, which redirects to the app, which
        calls `completeGoogleConnect`.
      responses:
        "200":
          description: Where to send the browser.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailConnect" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/mail/accounts/google/complete:
    post:
      operationId: completeGoogleConnect
      tags: [mail]
      description: |
        Finishes the consent flow with the `state` and `code` the server's
        callback passed to the app. The state must belong to the caller, who is
        the member that started it; 422 on `state` otherwise.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MailConnectComplete" }
      responses:
        "200":
          description: The connected account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailAccount" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/mail/accounts/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    patch:
      operationId: updateMailAccount
      tags: [mail]
      description: Pause or resume reading an account. A paused account is not read and nothing is sent to the model.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MailAccountUpdate" }
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailAccount" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: disconnectMailAccount
      tags: [mail]
      description: Stops reading the mailbox and revokes the grant. Classified messages are kept until the member deletes their account.
      responses:
        "204": { description: Disconnected. }
        default: { $ref: "#/components/responses/Problem" }

  /v1/mail/accounts/{id}/sync:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: syncMailAccount
      tags: [mail]
      description: |
        Checks the mailbox now and retries mail still waiting to be classified.
        409 unless the account is active. A sync held back by Gmail's rate limit
        still waits; `retry_at` says until when.
      responses:
        "200":
          description: The account, with its current progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailAccount" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/mail/accounts/{id}/rescan:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: rescanMailAccount
      tags: [mail]
      description: |
        Re-reads the last `days` days of the inbox (at most 500 messages, newest
        first), beyond the usual 30-day window. Mail already read is skipped, so
        only mail never seen is sent to the model. 409 unless the account is active.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [days]
              additionalProperties: false
              properties:
                days: { type: integer, minimum: 1, maximum: 90 }
      responses:
        "200":
          description: The account; progress updates as the mail is read.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailAccount" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/mail/messages:
    get:
      operationId: listMailMessages
      tags: [mail]
      description: Mail classified as relevant to a job application, newest first.
      parameters:
        - name: category
          in: query
          schema: { $ref: "#/components/schemas/MailCategory" }
        - name: job_id
          in: query
          schema: { type: string, format: uuid }
        - name: before
          in: query
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: A page of messages.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailMessagePage" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/mail/messages/{id}/status-change:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: resolveMailStatusChange
      tags: [mail]
      description: >
        Acts on the job status a message proposed. `apply` moves the job to the
        proposed status and `dismiss` declines it; both need an outcome of
        `review`. `undo` moves an applied job back to its earlier status, and
        fails with 409 if the job's status was changed since.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MailStatusChangeAction" }
      responses:
        "200":
          description: The updated message.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailMessage" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      description: >
        The member's notifications, newest first. `view` is `inbox` (default:
        everything not archived), `unread` (unread and not archived) or
        `archived`. A `mail` notification carries `mail`; a `job_alert`
        notification carries `job_alert`.
      parameters:
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/NotificationKind" }
        - name: view
          in: query
          schema: { type: string, enum: [inbox, unread, archived] }
        - name: before
          in: query
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: A page of notifications.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPage" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/notifications/summary:
    get:
      operationId: getNotificationSummary
      tags: [notifications]
      description: How many inbox notifications are unread. Refetch on `notification.updated` (also sent when job alerts arrive) and `mail.message.classified` events.
      responses:
        "200":
          description: The summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSummary" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/notifications/read:
    post:
      operationId: markNotificationsRead
      tags: [notifications]
      description: >
        Marks the named notifications read (or unread, with `unread`), or every
        inbox notification read when `all` is true.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationRead" }
      responses:
        "200":
          description: The summary after marking.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSummary" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/notifications/archive:
    post:
      operationId: archiveNotifications
      tags: [notifications]
      description: >
        Archives the named notifications, or every read one in the inbox when
        `read` is true. Archiving also marks them read. `restore` moves the
        named ones back to the inbox.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationArchive" }
      responses:
        "200":
          description: The summary after archiving.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSummary" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/job-watches:
    get:
      operationId: listJobWatches
      tags: [job-alerts]
      description: >
        The member's watches, newest first, and what their plan allows for
        search watchers. The worker reads each board every 30 minutes and runs
        each search at its interval, filing a `job_alert` notification for
        every new posting that matches; a posting alerts once however many
        watches find it.
      responses:
        "200":
          description: The watches.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobWatchList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createJobWatch
      tags: [job-alerts]
      description: >
        Starts a watch. A board watch reads the Greenhouse, Lever or Ashby
        board a careers link names once to check it exists (422 on `url`
        otherwise); watching a board twice answers 409. A search watch needs
        title keywords and a free slot in the member's plan (422 on `kind`
        otherwise). Either way, what is open now is not announced, only what
        opens later.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobWatchInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobWatch" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/job-watches/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    patch:
      operationId: updateJobWatch
      tags: [job-alerts]
      description: Changes the name, filters or pause of a watch; omitted fields stay.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobWatchPatch" }
      responses:
        "200":
          description: The updated watch.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobWatch" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteJobWatch
      tags: [job-alerts]
      description: Stops watching the board, removing its alerts.
      responses:
        "204": { description: Deleted. }
        default: { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
    edgeToken: { type: http, scheme: bearer, description: "An edge worker's token, issued in Administration. Not a user JWT." }

  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The ETag from the last read. A stale value fails with 412.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Retrying with the same key and body returns the original result.
      schema: { type: string, minLength: 1, maxLength: 255 }

  headers:
    ETag:
      description: The resource version, for If-Match.
      schema: { type: string }

  responses:
    Problem:
      description: An error.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    CvTemplate:
      type: object
      required: [name, version, typst, locales, published, assets]
      properties:
        name: { type: string }
        version: { type: integer }
        typst: { type: string, description: The Typst version the template compiles with. }
        locales: { type: array, items: { type: string } }
        published: { type: boolean }
        assets:
          type: object
          required: [main, strings, fonts]
          properties:
            main: { type: string }
            strings: { type: string }
            fonts: { type: array, items: { type: string } }
    CvPicks:
      type: object
      required: [include, exclude]
      properties:
        include: { type: array, maxItems: 1000, items: { type: string, format: uuid }, description: Evidence or highlight IDs, pinned. }
        exclude: { type: array, maxItems: 1000, items: { type: string, format: uuid } }
    CvDraft:
      type: object
      required: [job_id, template, template_version, locale, page_budget, picks, version, updated_at]
      properties:
        summary: { type: string, nullable: true, maxLength: 500 }
        job_id: { type: string, format: uuid }
        template: { type: string }
        template_version: { type: integer, nullable: true, description: Null follows the latest version. }
        locale: { type: string }
        page_budget: { type: integer, minimum: 1, maximum: 3 }
        picks: { $ref: "#/components/schemas/CvPicks" }
        version: { type: integer }
        updated_at: { type: string, format: date-time }
    CvDraftInput:
      type: object
      required: [template, locale, page_budget, picks]
      properties:
        summary: { type: string, nullable: true, maxLength: 500 }
        template: { type: string }
        template_version: { type: integer, nullable: true }
        locale: { type: string }
        page_budget: { type: integer, minimum: 1, maximum: 3 }
        picks: { $ref: "#/components/schemas/CvPicks" }
    CvFitInput:
      type: object
      required: [fit_key, dropped]
      properties:
        fit_key: { type: string, description: The fit_key of the preview the browser fitted. }
        dropped: { type: array, maxItems: 1000, items: { type: string, format: uuid }, description: Optional item IDs the fit left out. }
    CvPreview:
      type: object
      required: [draft, template, content, content_hash, fit_key, fit, summary_rows, trim, available, match]
      properties:
        summary_rows: { type: integer, minimum: 1, maximum: 4, description: "Lines fitting reserves for the summary. A manual summary is fitted as written instead." }
        summary_status: { type: string, description: "Includes waiting_for_fit until the browser reports a fit for the current content." }
        summary_suggestion: { type: string }
        summary_reason: { type: string }
        draft: { $ref: "#/components/schemas/CvDraft" }
        template: { $ref: "#/components/schemas/CvTemplate" }
        content: { type: object, additionalProperties: true, description: The template's content (templates/README.md). }
        content_hash: { type: string }
        fit_key: { type: string, description: Names this content for a fit; it leaves out the summary. }
        fit:
          type: object
          nullable: true
          description: The fit reported for fit_key, or null until the browser reports one.
          required: [dropped]
          properties:
            dropped: { type: array, items: { type: string } }
        trim: { type: array, items: { type: string }, description: Optional item IDs, least relevant first. }
        available:
          type: object
          required: [entries, highlights]
          properties:
            entries:
              type: array
              items:
                type: object
                required: [id, title, kind, section, reason]
                properties:
                  id: { type: string }
                  title: { type: string }
                  kind: { type: string }
                  section: { type: string }
                  reason: { type: string, enum: [excluded, suggested, not_selected] }
            highlights:
              type: array
              items:
                type: object
                required: [id, evidence_id, text, excluded]
                properties:
                  id: { type: string }
                  evidence_id: { type: string }
                  text: { type: string }
                  excluded: { type: boolean }
        match:
          type: object
          nullable: true
          required: [run_id, stale]
          properties:
            run_id: { type: string, format: uuid }
            stale: { type: boolean }
    CvExportInput:
      type: object
      required: [draft_version, content_hash, dropped, pages]
      properties:
        draft_version: { type: integer }
        content_hash: { type: string }
        dropped: { type: array, items: { type: string } }
        pages: { type: integer, minimum: 1, maximum: 50 }
        client_sha256: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
    CvExport:
      type: object
      required: [id, job_id, match_run_id, template, template_version, locale, document_date, page_budget, pages, overflow, content_hash, dropped, created_at]
      properties:
        id: { type: string, format: uuid }
        job_id: { type: string, format: uuid }
        match_run_id: { type: string, format: uuid, nullable: true }
        template: { type: string }
        template_version: { type: integer }
        locale: { type: string }
        document_date: { type: string, format: date }
        page_budget: { type: integer }
        pages: { type: integer }
        overflow: { type: boolean }
        content_hash: { type: string }
        client_sha256: { type: string, nullable: true }
        dropped: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        content: { type: object, additionalProperties: true }
    CvExportPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/CvExport" } }
    Problem:
      type: object
      required: [title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        request_id: { type: string }
        existing_id:
          type: string
          format: uuid
          description: "On 409 for a duplicate job URL: the job already saved."
        code: { type: string }
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string, description: "JSON path, e.g. highlights[0].text; empty for the whole request." }
        message: { type: string }

    Me:
      type: object
      required: [id, created_at, platform_role, membership]
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        platform_role: { type: string, enum: [member, owner] }
        membership:
          allOf: [{ $ref: "#/components/schemas/Membership" }]
          nullable: true

    Category:
      type: string
      enum: [education, paid, unpaid]
    Form:
      type: string
      enum: [engagement, credential, output, recognition]
    PartialDate:
      type: string
      description: A date known to year, month or day precision.
      pattern: '^\d{4}(-\d{2}(-\d{2})?)?$'
      example: "2021-03"

    Kind:
      type: object
      required: [kind, form, categories, child_only, details_schema]
      properties:
        kind: { type: string }
        form: { $ref: "#/components/schemas/Form" }
        categories:
          type: array
          items: { $ref: "#/components/schemas/Category" }
        child_only: { type: boolean, description: "Must be nested under an engagement." }
        details_schema:
          type: object
          additionalProperties: true
          description: JSON Schema for this kind's `details`.

    Link:
      type: object
      required: [label, url]
      properties:
        label: { type: string, maxLength: 100 }
        url: { type: string, format: uri }
    ProfileInput:
      type: object
      properties:
        auto_match: { type: boolean, default: true }
        full_name: { type: string }
        headline: { type: string }
        email: { type: string }
        phone: { type: string }
        location: { type: string }
        links:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/Link" }
        summary: { type: string }
    Profile:
      allOf:
        - $ref: "#/components/schemas/ProfileInput"
        - type: object
          required: [full_name, headline, email, phone, location, links, summary, version]
          properties:
            version: { type: integer }
            updated_at: { type: string, format: date-time }

    OrganizationType:
      type: string
      enum: [company, education, nonprofit, government, client, other]
    OrganizationInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        type: { $ref: "#/components/schemas/OrganizationType" }
        website: { type: string }
        location: { type: string }
    Organization:
      type: object
      required: [id, name, type, website, location, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { $ref: "#/components/schemas/OrganizationType" }
        website: { type: string }
        location: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SkillType:
      type: string
      enum: [hard, tool, soft, language]
    SkillInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        type: { $ref: "#/components/schemas/SkillType" }
        proficiency:
          type: string
          description: "beginner, intermediate, advanced, expert; for languages A1–C2 or native."
    Skill:
      type: object
      required: [id, name, type, proficiency]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { $ref: "#/components/schemas/SkillType" }
        proficiency: { type: string }
    SkillMerge:
      type: object
      required: [into]
      properties:
        into: { type: string, format: uuid }

    HighlightInput:
      type: object
      required: [text]
      properties:
        id: { type: string, format: uuid, description: "Keep an existing highlight (update only)." }
        text: { type: string }
        metric_value: { type: number, format: double }
        metric_unit: { type: string }
        auto_include: { type: boolean, default: true }
        skills:
          type: array
          items: { type: string }
    Highlight:
      type: object
      required: [id, text, metric_unit, auto_include, skills]
      properties:
        id: { type: string, format: uuid }
        text: { type: string }
        metric_value: { type: number, format: double }
        metric_unit: { type: string }
        auto_include: { type: boolean }
        skills:
          type: array
          items: { type: string }

    EvidenceUpdate:
      type: object
      required: [kind, title]
      properties:
        kind: { type: string, description: "One of GET /v1/kinds." }
        category:
          $ref: "#/components/schemas/Category"
        organization_id: { type: string, format: uuid }
        title: { type: string }
        summary: { type: string }
        location: { type: string }
        url: { type: string }
        start: { $ref: "#/components/schemas/PartialDate" }
        end: { $ref: "#/components/schemas/PartialDate" }
        is_current: { type: boolean, default: false }
        details:
          type: object
          additionalProperties: true
        auto_include:
          type: boolean
          description: "Whether matching may pick this automatically. Default true (false for career_break)."
        skills:
          type: array
          items: { type: string }
        highlights:
          type: array
          items: { $ref: "#/components/schemas/HighlightInput" }
    EvidenceCreate:
      allOf:
        - $ref: "#/components/schemas/EvidenceUpdate"
        - type: object
          properties:
            parent_id:
              type: string
              format: uuid
              description: "Nest under an engagement. The category then defaults to the parent's."
    ChildSummary:
      type: object
      required: [id, kind, form, title, archived]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        form: { $ref: "#/components/schemas/Form" }
        title: { type: string }
        archived: { type: boolean }
    Evidence:
      type: object
      required: [id, category, form, kind, title, summary, location, url, is_current, details,
                 auto_include, version, archived, created_at, updated_at, skills, highlights]
      properties:
        id: { type: string, format: uuid }
        parent_id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        category: { $ref: "#/components/schemas/Category" }
        form: { $ref: "#/components/schemas/Form" }
        kind: { type: string }
        title: { type: string }
        summary: { type: string }
        location: { type: string }
        url: { type: string }
        start: { $ref: "#/components/schemas/PartialDate" }
        end: { $ref: "#/components/schemas/PartialDate" }
        is_current: { type: boolean }
        details:
          type: object
          additionalProperties: true
        auto_include: { type: boolean }
        version: { type: integer }
        archived: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        skills:
          type: array
          items: { type: string }
        highlights:
          type: array
          items: { $ref: "#/components/schemas/Highlight" }
        children:
          type: array
          description: Only on single reads.
          items: { $ref: "#/components/schemas/ChildSummary" }
    EvidencePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Evidence" }
        next_cursor: { type: string }
    EvidenceMove:
      type: object
      properties:
        parent_id: { type: string, format: uuid }
        after_id: { type: string, format: uuid }
        before_id: { type: string, format: uuid }
    Reorder:
      type: object
      properties:
        after_id: { type: string, format: uuid }
        before_id: { type: string, format: uuid }

    JobStage:
      type: string
      description: "What a status means: saved (not applied), active (in process), offer, closed (any outcome)."
      enum: [saved, active, offer, closed]
    JobStatusColor:
      type: string
      enum: [gray, blue, yellow, orange, green, purple, pink, red, brown]
    JobStatusInput:
      type: object
      required: [name, stage]
      properties:
        name: { type: string, maxLength: 100 }
        color: { $ref: "#/components/schemas/JobStatusColor" }
        stage: { $ref: "#/components/schemas/JobStage" }
    JobStatus:
      type: object
      required: [id, name, color, stage, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { $ref: "#/components/schemas/JobStatusColor" }
        stage: { $ref: "#/components/schemas/JobStage" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WorkMode:
      type: string
      enum: [onsite, remote, hybrid]
    EmploymentType:
      type: string
      enum: [full_time, part_time, contract, temporary, internship, freelance]
    SalaryPeriod:
      type: string
      enum: [year, month, hour]
    JobSort:
      type: string
      enum: [-updated_at, -created_at, position]
      default: -updated_at
    PostingReadInput:
      type: object
      required: [url]
      properties:
        url: { type: string, description: "The posting's http(s) URL." }
        text: { type: string, description: "Posting text the person pasted. It is read instead of the page's when extracting." }
    PostingRead:
      type: object
      required: [description]
      properties:
        extraction_id: { type: string, format: uuid, description: "The extraction model's operation, when one was started." }
        page_error: { type: string, description: "Why the page could not be read, when the pasted text was used instead." }
        title: { type: string }
        company: { type: string }
        location: { type: string }
        work_mode: { $ref: "#/components/schemas/WorkMode" }
        employment_type: { $ref: "#/components/schemas/EmploymentType" }
        salary_min: { type: integer, format: int64, minimum: 0 }
        salary_max: { type: integer, format: int64, minimum: 0 }
        salary_currency: { type: string }
        salary_period: { $ref: "#/components/schemas/SalaryPeriod" }
        description: { type: string, description: "The page as markdown; empty when it had no text." }
    PostingExtraction:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [pending, completed, failed] }
        reason: { type: string, description: "Why it is waiting or failed, e.g. usage_limit." }
        title: { type: string }
        company: { type: string }
        location: { type: string }
        work_mode: { $ref: "#/components/schemas/WorkMode" }
        employment_type: { $ref: "#/components/schemas/EmploymentType" }
        salary_min: { type: integer, format: int64, minimum: 0 }
        salary_max: { type: integer, format: int64, minimum: 0 }
        salary_currency: { type: string }
        salary_period: { $ref: "#/components/schemas/SalaryPeriod" }
        description: { type: string, description: "The job description alone, as markdown, without the page around it (navigation, apply buttons, related jobs)." }
    JobInput:
      type: object
      required: [title]
      properties:
        status_id: { type: string, format: uuid }
        title: { type: string }
        company: { type: string }
        url: { type: string, description: "The posting. Unique per user once normalized." }
        location: { type: string }
        work_mode: { $ref: "#/components/schemas/WorkMode" }
        employment_type: { $ref: "#/components/schemas/EmploymentType" }
        salary_min: { type: integer, format: int64, minimum: 0 }
        salary_max: { type: integer, format: int64, minimum: 0 }
        salary_currency: { type: string, description: "ISO 4217, required with a salary." }
        salary_period: { $ref: "#/components/schemas/SalaryPeriod" }
        source: { type: string, description: "Where the posting was found, e.g. LinkedIn." }
        description: { type: string, description: "The posting text, read by matching." }
        notes: { type: string }
        applied_on:
          type: string
          format: date
          description: Set automatically the first time the job enters an active or offer stage.
    JobSummary:
      type: object
      required: [id, status_id, title, company, url, location, salary_currency, source,
                 position, version, archived, status_changed_at, created_at, updated_at]
      properties:
        match: { $ref: "#/components/schemas/MatchRunSummary" }
        id: { type: string, format: uuid }
        status_id: { type: string, format: uuid }
        title: { type: string }
        company: { type: string }
        url: { type: string }
        location: { type: string }
        work_mode: { $ref: "#/components/schemas/WorkMode" }
        employment_type: { $ref: "#/components/schemas/EmploymentType" }
        salary_min: { type: integer, format: int64 }
        salary_max: { type: integer, format: int64 }
        salary_currency: { type: string }
        salary_period: { $ref: "#/components/schemas/SalaryPeriod" }
        source: { type: string }
        applied_on: { type: string, format: date }
        position: { type: string, description: "Sort key within the status column." }
        version: { type: integer }
        archived: { type: boolean }
        status_changed_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Job:
      allOf:
        - $ref: "#/components/schemas/JobSummary"
        - type: object
          required: [description, notes]
          properties:
            description: { type: string }
            notes: { type: string }
    JobPage:
      type: object
      required: [items]
      properties:
        items:
