        "cap_30d_usd":
          "type": "string"
          "pattern": "^\\d+(\\.\\d{1,12})?$"
        "spent_7d_usd":
          "type": "string"
          "pattern": "^\\d+(\\.\\d{1,12})?$"
        "spent_30d_usd":
          "type": "string"
          "pattern": "^\\d+(\\.\\d{1,12})?$"
        "reserved_usd":
          "type": "string"
