openapi: 3.0.3
info:
  title: zapply API
  version: 0.4.0
  description: |
    Library of a person's career evidence (docs/parts/02-library.md) and the
    jobs they apply to (docs/parts/04-jobs.md).
    Live changes stream from /v1/events (docs/parts/03-events.md).
    Every /v1 operation requires `Authorization: Bearer <jwt>`. Errors are
    RFC 9457 problem+json; validation errors (422) list failing fields.
security:
  - bearer: []
paths:
  /v1/me:
    get:
      operationId: getMe
      tags: [account]
      responses:
        "200":
          description: The authenticated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/kinds:
    get:
      operationId: listKinds
      tags: [library]
      description: The fixed catalog of evidence kinds and the schema of each kind's `details`.
      responses:
        "200":
          description: All kinds, in display order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Kind" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/profile:
    get:
      operationId: getProfile
      tags: [library]
      responses:
        "200":
          description: The profile. Version 0 means it was never saved.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: putProfile
      tags: [library]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "200":
          description: The saved profile.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/organizations:
    get:
      operationId: listOrganizations
      tags: [library]
      responses:
        "200":
          description: All organizations, by name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Organization" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createOrganization
      tags: [library]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/organizations/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getOrganization
      tags: [library]
      responses:
        "200":
          description: The organization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateOrganization
      tags: [library]
      description: Replaces the organization's fields. Renaming updates linked evidence.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteOrganization
      tags: [library]
      description: Fails with 409 while evidence references the organization.
      responses:
        "204": { description: Deleted. }
        default: { $ref: "#/components/responses/Problem" }

  /v1/skills:
    get:
      operationId: listSkills
      tags: [library]
      responses:
        "200":
          description: All skills, by name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Skill" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createSkill
      tags: [library]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SkillInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Skill" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/skills/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    patch:
      operationId: updateSkill
      tags: [library]
      description: Replaces the skill's fields. Renaming updates linked evidence.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SkillInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Skill" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteSkill
      tags: [library]
      responses:
        "204": { description: Deleted, and unlinked everywhere. }
        default: { $ref: "#/components/responses/Problem" }
  /v1/skills/{id}/merge:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: mergeSkill
      tags: [library]
      description: Moves every link to `into`, then deletes this skill.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SkillMerge" }
      responses:
        "200":
          description: The surviving skill.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Skill" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/evidences:
    get:
      operationId: listEvidences
      tags: [library]
      parameters:
        - { name: category, in: query, schema: { $ref: "#/components/schemas/Category" } }
        - { name: form, in: query, schema: { $ref: "#/components/schemas/Form" } }
        - { name: kind, in: query, schema: { type: string } }
        - { name: parent_id, in: query, schema: { type: string, format: uuid } }
        - { name: top_level, in: query, schema: { type: boolean, default: false } }
        - { name: include_archived, in: query, schema: { type: boolean, default: false } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: A page of evidence documents, by category then position.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvidencePage" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createEvidence
      tags: [library]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvidenceCreate" }
      responses:
        "201":
          description: Created (or replayed for a repeated Idempotency-Key).
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Evidence" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/evidences/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getEvidence
      tags: [library]
      responses:
        "200":
          description: The document, with summaries of its children.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Evidence" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: putEvidence
      tags: [library]
      description: |
        Replaces the whole document. Highlights sent with an `id` keep it;
        omitted highlights are deleted. Re-parent with the move operation.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvidenceUpdate" }
      responses:
        "200":
          description: The saved document.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Evidence" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteEvidence
      tags: [library]
      parameters:
        - { name: cascade, in: query, schema: { type: boolean, default: false } }
      responses:
        "204": { description: Deleted. }
        default: { $ref: "#/components/responses/Problem" }
  /v1/evidences/{id}/move:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: moveEvidence
      tags: [library]
      description: |
        Places the evidence under `parent_id` (omit for top level), after
        `after_id` or before `before_id` among its new siblings, or last.
        Moving under a parent adopts the parent's category.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvidenceMove" }
      responses:
        "200":
          description: The moved document.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Evidence" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/evidences/{id}/archive:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: archiveEvidence
      tags: [library]
      responses:
        "200":
          description: Archived.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Evidence" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/evidences/{id}/unarchive:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: unarchiveEvidence
      tags: [library]
      responses:
        "200":
          description: Restored.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Evidence" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/job-statuses:
    get:
      operationId: listJobStatuses
      tags: [jobs]
      description: The board's columns in order. The defaults are created on first use.
      responses:
        "200":
          description: All statuses, in board order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/JobStatus" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createJobStatus
      tags: [jobs]
      description: Adds a status as the last column.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobStatusInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobStatus" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/job-statuses/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    patch:
      operationId: updateJobStatus
      tags: [jobs]
      description: Replaces the status's name, color and stage. Activity history keeps the old names.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobStatusInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobStatus" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteJobStatus
      tags: [jobs]
      description: |
        Fails with 409 while jobs have this status, unless `move_to` names
        another status to move them to first, or if it is the last status.
      parameters:
        - { name: move_to, in: query, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted. }
        default: { $ref: "#/components/responses/Problem" }
  /v1/job-statuses/{id}/move:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: moveJobStatus
      tags: [jobs]
      description: Places the status after `after_id` or before `before_id`, or last.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Reorder" }
      responses:
        "200":
          description: Moved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobStatus" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      parameters:
        - name: status_id
          in: query
          style: form
          explode: true
          schema: { type: array, items: { type: string, format: uuid } }
        - name: stage
          in: query
          style: form
          explode: true
          schema: { type: array, items: { $ref: "#/components/schemas/JobStage" } }
        - { name: q, in: query, description: "Case-insensitive match on title or company.", schema: { type: string } }
        - { name: include_archived, in: query, schema: { type: boolean, default: false } }
        - { name: sort, in: query, schema: { $ref: "#/components/schemas/JobSort" } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: A page of job summaries (without description and notes).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobPage" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createJob
      tags: [jobs]
      description: |
        Saves a job first in its status's column (default: the first status).
        A posting URL already saved returns 409 with `existing_id`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobInput" }
      responses:
        "201":
          description: Created.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/jobs/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getJob
      tags: [jobs]
      responses:
        "200":
          description: The job, with description and notes.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: putJob
      tags: [jobs]
      description: |
        Replaces the job. A new `status_id` moves it to the top of that
        column; omit it to keep the status.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobInput" }
      responses:
        "200":
          description: The saved job.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteJob
      tags: [jobs]
      responses:
        "204": { description: Deleted, with its activity. }
        default: { $ref: "#/components/responses/Problem" }
  /v1/jobs/{id}/move:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: moveJob
      tags: [jobs]
      description: |
        Drag and drop on the board: into `status_id` (omit to stay in the
        column), after `after_id` or before `before_id`, or first.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobMove" }
      responses:
        "200":
          description: The moved job.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/jobs/{id}/archive:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: archiveJob
      tags: [jobs]
      responses:
        "200":
          description: Archived.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/jobs/{id}/unarchive:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: unarchiveJob
      tags: [jobs]
      responses:
        "200":
          description: Restored.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/jobs/{id}/activities:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: listJobActivities
      tags: [jobs]
      responses:
        "200":
          description: The job's timeline, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/JobActivity" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createJobNote
      tags: [jobs]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobNoteInput" }
      responses:
        "201":
          description: The note.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobActivity" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/jobs/{id}/activities/{activity_id}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - { name: activity_id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateJobNote
      tags: [jobs]
      description: Only notes can be edited (409 otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobNoteInput" }
      responses:
        "200":
          description: The note.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobActivity" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteJobNote
      tags: [jobs]
      description: Only notes can be deleted (409 otherwise).
      responses:
        "204": { description: Deleted. }
        default: { $ref: "#/components/responses/Problem" }

  /v1/job-views:
    get:
      operationId: listJobViews
      tags: [jobs]
      responses:
        "200":
          description: Saved views, in order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/JobView" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createJobView
      tags: [jobs]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobViewInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobView" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/job-views/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      operationId: putJobView
      tags: [jobs]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobViewInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobView" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteJobView
      tags: [jobs]
      responses:
        "204": { description: Deleted. }
        default: { $ref: "#/components/responses/Problem" }

  /v1/events:
    get:
      operationId: streamEvents
      tags: [events]
      description: |
        The user's change feed as Server-Sent Events (`text/event-stream`).
        Served by a hand-written handler; the generated server skips the
        `events` tag.

        Each event has `id` (its seq), `event` (the topic, e.g.
        `evidence.updated`) and `data` (an `EventData` JSON object). Refetch
        the resource it names; events can repeat, so they are hints, not
        state.

        - `reset`: the Last-Event-ID is too old to replay. Refetch everything
          after `ready`.
        - `ready`: replay is done and the stream is live. Its `id` is the
          position to resume from. Without a Last-Event-ID, fetch data only
          after `ready`.

        Comments (`: ping`) arrive every 20 s. The stream ends at token
        expiry, when the server drains, when the client falls too far
        behind, or when the server loses NATS. Reconnect with a fresh token
        and `Last-Event-ID`. Browsers' `EventSource` can't send the bearer
        header, so use a fetch-based SSE client.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: The id of the last event received; replay starts after it.
          schema: { type: string, pattern: "^[0-9]+$" }
      responses:
        "200":
          description: An open event stream.
          content:
            text/event-stream:
              schema: { type: string }
        "429":
          description: Too many streams are open for this user.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503":
          description: Live events are temporarily unavailable; retry after `Retry-After` seconds.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default: { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }

  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The ETag from the last read. A stale value fails with 412.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Retrying with the same key and body returns the original result.
      schema: { type: string, minLength: 1, maxLength: 255 }

  headers:
    ETag:
      description: The resource version, for If-Match.
      schema: { type: string }

  responses:
    Problem:
      description: An error.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      required: [title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        request_id: { type: string }
        existing_id:
          type: string
          format: uuid
          description: "On 409 for a duplicate job URL: the job already saved."
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string, description: "JSON path, e.g. highlights[0].text; empty for the whole request." }
        message: { type: string }

    Me:
      type: object
      required: [id, created_at]
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }

    Category:
      type: string
      enum: [education, paid, unpaid]
    Form:
      type: string
      enum: [engagement, credential, output, recognition]
    PartialDate:
      type: string
      description: A date known to year, month or day precision.
      pattern: '^\d{4}(-\d{2}(-\d{2})?)?$'
      example: "2021-03"

    Kind:
      type: object
      required: [kind, form, categories, child_only, details_schema]
      properties:
        kind: { type: string }
        form: { $ref: "#/components/schemas/Form" }
        categories:
          type: array
          items: { $ref: "#/components/schemas/Category" }
        child_only: { type: boolean, description: "Must be nested under an engagement." }
        details_schema:
          type: object
          additionalProperties: true
          description: JSON Schema for this kind's `details`.

    Link:
      type: object
      required: [label, url]
      properties:
        label: { type: string, maxLength: 100 }
        url: { type: string, format: uri }
    ProfileInput:
      type: object
      properties:
        full_name: { type: string }
        headline: { type: string }
        email: { type: string }
        phone: { type: string }
        location: { type: string }
        links:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/Link" }
        summary: { type: string }
    Profile:
      allOf:
        - $ref: "#/components/schemas/ProfileInput"
        - type: object
          required: [full_name, headline, email, phone, location, links, summary, version]
          properties:
            version: { type: integer }
            updated_at: { type: string, format: date-time }

    OrganizationType:
      type: string
      enum: [company, education, nonprofit, government, client, other]
    OrganizationInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        type: { $ref: "#/components/schemas/OrganizationType" }
        website: { type: string }
        location: { type: string }
    Organization:
      type: object
      required: [id, name, type, website, location, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { $ref: "#/components/schemas/OrganizationType" }
        website: { type: string }
        location: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SkillType:
      type: string
      enum: [hard, tool, soft, language]
    SkillInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        type: { $ref: "#/components/schemas/SkillType" }
        proficiency:
          type: string
          description: "beginner, intermediate, advanced, expert; for languages A1–C2 or native."
    Skill:
      type: object
      required: [id, name, type, proficiency]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { $ref: "#/components/schemas/SkillType" }
        proficiency: { type: string }
    SkillMerge:
      type: object
      required: [into]
      properties:
        into: { type: string, format: uuid }

    HighlightInput:
      type: object
      required: [text]
      properties:
        id: { type: string, format: uuid, description: "Keep an existing highlight (update only)." }
        text: { type: string }
        metric_value: { type: number, format: double }
        metric_unit: { type: string }
        auto_include: { type: boolean, default: true }
        skills:
          type: array
          items: { type: string }
    Highlight:
      type: object
      required: [id, text, metric_unit, auto_include, skills]
      properties:
        id: { type: string, format: uuid }
        text: { type: string }
        metric_value: { type: number, format: double }
        metric_unit: { type: string }
        auto_include: { type: boolean }
        skills:
          type: array
          items: { type: string }

    EvidenceUpdate:
      type: object
      required: [kind, title]
      properties:
        kind: { type: string, description: "One of GET /v1/kinds." }
        category:
          $ref: "#/components/schemas/Category"
        organization_id: { type: string, format: uuid }
        title: { type: string }
        summary: { type: string }
        location: { type: string }
        url: { type: string }
        start: { $ref: "#/components/schemas/PartialDate" }
        end: { $ref: "#/components/schemas/PartialDate" }
        is_current: { type: boolean, default: false }
        details:
          type: object
          additionalProperties: true
        auto_include:
          type: boolean
          description: "Whether matching may pick this automatically. Default true (false for career_break)."
        skills:
          type: array
          items: { type: string }
        highlights:
          type: array
          items: { $ref: "#/components/schemas/HighlightInput" }
    EvidenceCreate:
      allOf:
        - $ref: "#/components/schemas/EvidenceUpdate"
        - type: object
          properties:
            parent_id:
              type: string
              format: uuid
              description: "Nest under an engagement. The category then defaults to the parent's."
    ChildSummary:
      type: object
      required: [id, kind, form, title, archived]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        form: { $ref: "#/components/schemas/Form" }
        title: { type: string }
        archived: { type: boolean }
    Evidence:
      type: object
      required: [id, category, form, kind, title, summary, location, url, is_current, details,
                 auto_include, version, archived, created_at, updated_at, skills, highlights]
      properties:
        id: { type: string, format: uuid }
        parent_id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        category: { $ref: "#/components/schemas/Category" }
        form: { $ref: "#/components/schemas/Form" }
        kind: { type: string }
        title: { type: string }
        summary: { type: string }
        location: { type: string }
        url: { type: string }
        start: { $ref: "#/components/schemas/PartialDate" }
        end: { $ref: "#/components/schemas/PartialDate" }
        is_current: { type: boolean }
        details:
          type: object
          additionalProperties: true
        auto_include: { type: boolean }
        version: { type: integer }
        archived: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        skills:
          type: array
          items: { type: string }
        highlights:
          type: array
          items: { $ref: "#/components/schemas/Highlight" }
        children:
          type: array
          description: Only on single reads.
          items: { $ref: "#/components/schemas/ChildSummary" }
    EvidencePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Evidence" }
        next_cursor: { type: string }
    EvidenceMove:
      type: object
      properties:
        parent_id: { type: string, format: uuid }
        after_id: { type: string, format: uuid }
        before_id: { type: string, format: uuid }
    Reorder:
      type: object
      properties:
        after_id: { type: string, format: uuid }
        before_id: { type: string, format: uuid }

    JobStage:
      type: string
      description: "What a status means: saved (not applied), active (in process), offer, closed (any outcome)."
      enum: [saved, active, offer, closed]
    JobStatusColor:
      type: string
      enum: [gray, blue, yellow, orange, green, purple, pink, red, brown]
    JobStatusInput:
      type: object
      required: [name, stage]
      properties:
        name: { type: string, maxLength: 100 }
        color: { $ref: "#/components/schemas/JobStatusColor" }
        stage: { $ref: "#/components/schemas/JobStage" }
    JobStatus:
      type: object
      required: [id, name, color, stage, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { $ref: "#/components/schemas/JobStatusColor" }
        stage: { $ref: "#/components/schemas/JobStage" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WorkMode:
      type: string
      enum: [onsite, remote, hybrid]
    EmploymentType:
      type: string
      enum: [full_time, part_time, contract, temporary, internship, freelance]
    SalaryPeriod:
      type: string
      enum: [year, month, hour]
    JobSort:
      type: string
      enum: [-updated_at, -created_at, position]
      default: -updated_at
    JobInput:
      type: object
      required: [title]
      properties:
        status_id: { type: string, format: uuid }
        title: { type: string }
        company: { type: string }
        url: { type: string, description: "The posting. Unique per user once normalized." }
        location: { type: string }
        work_mode: { $ref: "#/components/schemas/WorkMode" }
        employment_type: { $ref: "#/components/schemas/EmploymentType" }
        salary_min: { type: integer, format: int64, minimum: 0 }
        salary_max: { type: integer, format: int64, minimum: 0 }
        salary_currency: { type: string, description: "ISO 4217, required with a salary." }
        salary_period: { $ref: "#/components/schemas/SalaryPeriod" }
        source: { type: string, description: "Where the posting was found, e.g. LinkedIn." }
        description: { type: string, description: "The posting text, read by matching." }
        notes: { type: string }
        applied_on:
          type: string
          format: date
          description: Set automatically the first time the job enters an active or offer stage.
    JobSummary:
      type: object
      required: [id, status_id, title, company, url, location, salary_currency, source,
                 position, version, archived, status_changed_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        status_id: { type: string, format: uuid }
        title: { type: string }
        company: { type: string }
        url: { type: string }
        location: { type: string }
        work_mode: { $ref: "#/components/schemas/WorkMode" }
        employment_type: { $ref: "#/components/schemas/EmploymentType" }
        salary_min: { type: integer, format: int64 }
        salary_max: { type: integer, format: int64 }
        salary_currency: { type: string }
        salary_period: { $ref: "#/components/schemas/SalaryPeriod" }
        source: { type: string }
        applied_on: { type: string, format: date }
        position: { type: string, description: "Sort key within the status column." }
        version: { type: integer }
        archived: { type: boolean }
        status_changed_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Job:
      allOf:
        - $ref: "#/components/schemas/JobSummary"
        - type: object
          required: [description, notes]
          properties:
            description: { type: string }
            notes: { type: string }
    JobPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/JobSummary" }
        next_cursor: { type: string }
    JobMove:
      type: object
      properties:
        status_id: { type: string, format: uuid }
        after_id: { type: string, format: uuid }
        before_id: { type: string, format: uuid }
    JobActivityType:
      type: string
      enum: [created, status_changed, note]
    JobActivity:
      type: object
      required: [id, job_id, type, from_status, to_status, body, occurred_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        job_id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/JobActivityType" }
        from_status: { type: string, description: "Status name when it happened." }
        to_status: { type: string }
        body: { type: string }
        occurred_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    JobNoteInput:
      type: object
      required: [body]
      properties:
        body: { type: string }
        occurred_at: { type: string, format: date-time, description: "When it happened; default now." }
    JobViewLayout:
      type: string
      enum: [board, table]
    JobViewFilters:
      type: object
      additionalProperties: false
      properties:
        status_ids:
          type: array
          items: { type: string, format: uuid }
        stages:
          type: array
          items: { $ref: "#/components/schemas/JobStage" }
        q: { type: string }
        include_archived: { type: boolean }
    JobViewInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
        layout: { $ref: "#/components/schemas/JobViewLayout" }
        filters: { $ref: "#/components/schemas/JobViewFilters" }
        sort: { $ref: "#/components/schemas/JobSort" }
    JobView:
      type: object
      required: [id, name, layout, filters, sort, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        layout: { $ref: "#/components/schemas/JobViewLayout" }
        filters: { $ref: "#/components/schemas/JobViewFilters" }
        sort: { $ref: "#/components/schemas/JobSort" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    EventData:
      type: object
      description: |
        The `data` of a change event: the resource it concerns. `version` is
        set for versioned resources (profile, evidence, job); `job_id` for
        job activity.
      required: [id]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        job_id: { type: string, format: uuid }
    EventTopic:
      type: string
      description: The SSE `event` name of a change event.
      enum:
        - profile.updated
        - organization.created
        - organization.updated
        - organization.deleted
        - evidence.created
        - evidence.updated
        - evidence.moved
        - evidence.archived
        - evidence.unarchived
        - evidence.deleted
        - skill.created
        - skill.updated
        - skill.merged
        - skill.deleted
        - job_status.created
        - job_status.updated
        - job_status.moved
        - job_status.deleted
        - job.created
        - job.updated
        - job.moved
        - job.archived
        - job.unarchived
        - job.deleted
        - job_activity.created
        - job_activity.updated
        - job_activity.deleted
        - job_view.created
        - job_view.updated
        - job_view.deleted
