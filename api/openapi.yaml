        include_archived: { type: boolean }
    JobViewInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
        layout: { $ref: "#/components/schemas/JobViewLayout" }
        filters: { $ref: "#/components/schemas/JobViewFilters" }
        sort: { $ref: "#/components/schemas/JobSort" }
    JobView:
      type: object
      required: [id, name, layout, filters, sort, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        layout: { $ref: "#/components/schemas/JobViewLayout" }
        filters: { $ref: "#/components/schemas/JobViewFilters" }
        sort: { $ref: "#/components/schemas/JobSort" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    EventData:
      type: object
      description: |
        The `data` of a change event: the resource it concerns. `version` is
        set for versioned resources (profile, evidence, job); `job_id` for
        job activity.
      required: [id]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        job_id: { type: string, format: uuid }
    EventTopic:
      type: string
      description: The SSE `event` name of a change event.
      enum:
        - profile.updated
        - organization.created
        - organization.updated
        - organization.deleted
        - evidence.created
        - evidence.updated
        - evidence.moved
        - evidence.archived
        - evidence.unarchived
        - evidence.deleted
        - skill.created
        - skill.updated
        - skill.merged
        - skill.deleted
        - job_status.created
        - job_status.updated
        - job_status.moved
        - job_status.deleted
        - job.created
        - job.updated
        - job.moved
        - job.archived
        - job.unarchived
        - job.deleted
        - job_activity.created
        - job_activity.updated
        - job_activity.deleted
        - job_view.created
        - job_view.updated
        - job_view.deleted
        - membership.changed
        - usage.changed
        - model_operation.changed
        - match_run.changed

    "Plan":
      "type": "object"
      "required":
        - "id"
        - "name"
        - "cap_7d_usd"
        - "cap_30d_usd"
