        The `data` of a change event: the resource it concerns. `version` is
        set for versioned resources (profile, evidence, job); `job_id` for
        job activity.
      required: [id]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        job_id: { type: string, format: uuid }
    EventTopic:
      type: string
