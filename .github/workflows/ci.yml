name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: zapply
          POSTGRES_PASSWORD: zapply
          POSTGRES_DB: zapply
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zapply"
          --health-interval 2s --health-retries 30
    env:
      ZAPPLY_TEST_DATABASE_URL: postgres://zapply:zapply@localhost:5432/zapply?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Create runtime role
        run: psql "$ZAPPLY_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f deploy/postgres/init.sql
      - name: Generated code is up to date
        run: |
          go tool sqlc generate
          go tool oapi-codegen -config api/oapi-codegen.yaml api/openapi.yaml
          git diff --exit-code -- internal/store/db internal/api/gen
      - name: Format and vet
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: Build image
        run: docker build -t zapply .

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code -- src/app/api/schema.d.ts
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
