name: ci
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

jobs:
  # Runs on the self-hosted runners from scripts/ci-runner.sh (deploy/ci-runner/),
  # which provide Postgres (with init.sql's roles), Typst, poppler and the Go caches.
  # While none is running, jobs wait in the queue rather than fail.
  go-checks:
    runs-on: [self-hosted, zapply]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # The runners keep GOMODCACHE and GOCACHE on a local volume.
          cache: false
      - name: Validate migration catalog
        run: go test -count=1 ./internal/store -run '^TestMigrationCatalogValid$'
      - name: Generated code is up to date
        run: |
          go tool sqlc generate
          go tool oapi-codegen -config api/oapi-codegen.yaml api/openapi.yaml
          git diff --exit-code -- internal/store/db internal/api/gen
      - name: Format and vet
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
      - name: Test
        env:
          ZAPPLY_REQUIRE_TYPST: "1"
        run: go test -race -count=1 ./...

  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: zapply
          cache-from: type=gha,scope=ci-image
          cache-to: type=gha,scope=ci-image,mode=max

  # Preserve the required Go check; the image is built on pushes to main.
  go:
    if: always()
    needs: [go-checks, image]
    runs-on: [self-hosted, zapply]
    steps:
      - name: Check results
        env:
          GO_CHECKS_RESULT: ${{ needs.go-checks.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$GO_CHECKS_RESULT" = success
          if [ "$EVENT_NAME" = push ]; then
            test "$IMAGE_RESULT" = success
          else
            test "$IMAGE_RESULT" = skipped
          fi

  web:
    runs-on: [self-hosted, zapply]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # No `cache:`: npm packages live on the runners' local volume, not in Actions cache.
          node-version-file: web/package.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code -- src/app/api/schema.d.ts
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
