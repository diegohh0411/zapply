# The whole app on this machine against the hosted database: the image Heroku
# runs (api, worker and relay in one process, embedded NATS) plus Firecrawl
# Local. Settings come from .env, with production values (see README, "Running
# the app on this machine"). `podman compose up -d`, then `podman compose down`.
# Development dependencies live in deploy/compose.yaml instead.
name: zapply-app
services:
  app:
    build:
      context: .
      target: all
    image: localhost/zapply:latest
    env_file: .env
    environment:
      HTTP_ADDR: ":8080"
      FIRECRAWL_URL: http://firecrawl:3002
    ports:
      - "127.0.0.1:${ZAPPLY_PORT:-8080}:8080"
    depends_on:
      - firecrawl
  firecrawl:
    build: ./deploy/firecrawl
    image: localhost/zapply-firecrawl:0.1.0
    environment:
      FIRECRAWL_CLOUD: ${FIRECRAWL_CLOUD:-off}
      FIRECRAWL_LOCAL_TOKEN: ${FIRECRAWL_TOKEN:?set FIRECRAWL_TOKEN in .env}
