# The whole app on this machine against the hosted database: the image Heroku
# runs (api, worker and relay in one process, embedded NATS) plus Firecrawl
# Local. Settings come from .env, with production values (see README, "Running
# the app on this machine"). `podman compose up -d`, then `podman compose down`.
# Development dependencies live in deploy/compose.yaml instead.
name: zapply-app
services:
  app:
    build:
      context: .
      target: all
    image: localhost/zapply:latest
    env_file: .env
    environment:
      HTTP_ADDR: ":8080"
      FIRECRAWL_URL: http://firecrawl:3002
    ports:
      - "127.0.0.1:${ZAPPLY_PORT:-8080}:8080"
    depends_on:
      - firecrawl
  firecrawl:
    build: ./deploy/firecrawl
    image: localhost/zapply-firecrawl:0.1.0
    # The app calls it by its service name, which it otherwise refuses.
    command: ["serve", "--host", "0.0.0.0", "--allowed-host", "firecrawl"]
    environment:
      FIRECRAWL_CLOUD: ${FIRECRAWL_CLOUD:-off}
      FIRECRAWL_LOCAL_TOKEN: ${FIRECRAWL_TOKEN:?set FIRECRAWL_TOKEN in .env}
  # Crawl4AI renders pages in a stealth Chromium. Not published to the host:
  # add it in Administration, Scraping as a Crawl4AI provider at
  # http://crawl4ai:11235 (see README, "Scraping posting links").
  crawl4ai:
    image: docker.io/unclecode/crawl4ai:0.9.5
    # Chromium needs more shared memory than the container default.
    shm_size: 1g
    environment:
      # Optional bearer token; add the same value as a Crawl4AI system key and
      # pick it on the provider. Empty leaves the server open on this network.
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_TOKEN:-}
      CRAWL4AI_NO_CLOUD_NOTICE: "1"
    expose:
      - "11235"
