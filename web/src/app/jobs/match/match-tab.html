<div class="flex min-w-0 flex-wrap items-center gap-x-3 gap-y-1 text-sm" aria-label="Job match">
  @if (active()) {
    <span class="flex items-center gap-2 text-muted-foreground" role="status" aria-live="polite">
      <span
        aria-hidden="true"
        class="inline-block size-3.5 shrink-0 animate-spin rounded-full border-2 border-current border-r-transparent motion-reduce:animate-none"
      ></span>
      {{ statusLabel() }}
      @if (run(); as r) {
        @if (r.total) {
          <span class="tabular-nums">{{ r.answered + r.unanswered }}/{{ r.total }}</span>
        }
      }
    </span>
    <button z-button zType="ghost" zSize="sm" [zDisabled]="busy()" (click)="action('cancel')">
      Cancel
    </button>
  } @else if (run()) {
    @if (notice(); as n) {
      <span class="text-amber-700 dark:text-amber-400">{{ n }}</span>
    }
    <button
      z-button
      zType="ghost"
      zSize="sm"
      [zDisabled]="busy()"
      [zLoading]="busy()"
      (click)="rerun()"
    >
      <ng-icon name="lucideRefreshCw" /> Re-run match
    </button>
  } @else if (!store.errors().get(jobId())) {
    <button
      z-button
      zSize="sm"
      zType="outline"
      [zDisabled]="busy()"
      [zLoading]="busy()"
      [attr.title]="costHint()"
      (click)="action('start')"
    >
      <ng-icon name="lucideSearch" /> Check my match
    </button>
  }
  @if (error() || store.errors().get(jobId()); as message) {
    <span role="alert" class="text-destructive">{{ message }}</span>
  }
</div>
