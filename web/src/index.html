  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "zapply",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Web",
    "description": "Tailor your CV to each job and track every application with zapply."
  }
  </script>

    <script>
      (function () {
        const html = document.documentElement;

        const query = window.matchMedia('(prefers-color-scheme: dark)');
        const applyTheme = (isDark) => {
          html.classList.toggle('dark', isDark);
          html.classList.toggle('dark-theme', isDark);
          html.setAttribute('data-theme', 'system');
          html.style.colorScheme = isDark ? 'dark' : 'light';
        };
        applyTheme(query.matches);
        query.addEventListener('change', (event) => applyTheme(event.matches));
      })();
    </script>

  </head>
<body>
  <app-root>
    <!-- Crawlers that do not run JavaScript read this; Angular replaces it on boot. -->
    <main>
      <h1>zapply</h1>
      <p>Tailor your CV to each job and track every application in one place.</p>
    </main>
  </app-root>
</body>
</html>
