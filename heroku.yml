build:
  docker:
    # One dyno runs api, worker and relay with embedded NATS. To split them
    # again, point web at the default target and add worker (target: worker)
    # and relay (target: relay) process types.
    web:
      dockerfile: Dockerfile
      target: all
# No run section: Heroku would wrap a command in /bin/sh -c, which the
# distroless image lacks. Each target supplies its own exec-form CMD.
